databaseChangeLog:
  - changeSet:
      comment: Добавление колонки запланированного времени выполнения задачи для таблицы задач
      id: 20261027-09-add-planned-time-column
      author: MonYamau
      changes:
        - addColumn:
            tableName: tasks
            columns:
              - column:
                  name: planned_completion_at
                  type: timestamptz

      rollback:
        - dropColumn:
            tableName: tasks
            columnName: planned_completion_at